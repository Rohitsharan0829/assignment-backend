# =============================================
# Student Assignment Management System
# Application Configuration
# =============================================

# Server configuration (cloud platforms commonly provide PORT).
server.port=${PORT:${SERVER_PORT:8080}}

# =============================================
# MySQL Database Configuration
# =============================================
# IMPORTANT: Create the database first by running:
#   CREATE DATABASE student_assignment_db;
#
# Update these values to match your MySQL setup.
# For security, use environment variables in production.
# =============================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_assignment_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate Configuration
# =============================================
# Apply database/schema.sql separately; validate mappings at startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# File Upload Configuration
# =============================================
# Maximum file size: 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory where uploaded files are stored
file.upload-dir=${UPLOAD_DIR:./uploads}

# =============================================
# JWT Configuration
# =============================================
# IMPORTANT: Change this secret key in production!
# Use environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =============================================
# CORS Configuration
# =============================================
# Allow frontend to connect from these origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081}

# =============================================
# Logging Configuration
# =============================================
logging.level.com.studentassignment=${APP_LOG_LEVEL:INFO}
